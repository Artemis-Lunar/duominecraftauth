# Duo Auth API configuration
duo.apiHost=api-xxxxxxxx.duosecurity.com
duo.integrationKey=DIXXXXXXXXXXXXXXXXXX
duo.secretKey=replace-me
duo.timeoutSeconds=65
duo.failOpen=false

# Comma-separated list of Minecraft usernames that must complete Duo before logging in.
# You can still use this for explicit always-protected accounts.
security.protectedPlayers=YourAdminName

# Optional: path to a backend ops.json file. If set, any username in that file will also require Duo.
# Example:
# security.opsFile=C:/Minecraft/fabric-server/ops.json
security.opsFile=

# Optional explicit mapping: mc username -> Duo username
# Format: bindings.<minecraftName>=<duoUsername>
# Example:
# bindings.JaneDoe=jane.doe

# Messages shown when login is denied
messages.prefix=[Duo]
messages.denied=You must approve the Duo push before joining.
messages.timeout=Duo verification timed out. Please try again.
messages.failed=Duo verification failed.
messages.error=Duo is currently unavailable. Contact an admin.
messages.enroll=Duo enrollment is required before this account can log in.

